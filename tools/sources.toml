# Magazines in the app catalog (tools/build_catalog.py). Categories keep content types apart in the app.
# Collections are read from the snapshot tools/sources/ia/<collection>.json (refresh: build_catalog.py --refresh).
# Issue ids must never change: user.db (progress, highlights, downloads) stores them. Amazing Stories keeps its
# historical ids 1–309; every other magazine has its own `block`, and its issue ids are
# block × 10,000,000 + year × 1000 + month × 10 + n (n = 0 for the first issue of that month), so refreshing a
# collection or adding a magazine never moves an existing id. Give each new magazine a new, unused block.

[[category]]
slug = "pulp"
name = "Pulp & science fiction"

[[category]]
slug = "rpg"
name = "RPG magazines"

[[category]]
slug = "comics"
name = "Comics"

[[magazine]]
slug = "amazing-stories"
name = "Amazing Stories"
category = "pulp"
adapter = "amazing_stories"
source = "data/source/Amazing_Stories_Reference_Guide.pdf"

[[magazine]]
slug = "fantasy-and-science-fiction"
block = 2
name = "The Magazine of Fantasy & Science Fiction"
category = "pulp"
adapter = "ia_collection"
collection = "fantasyandsciencefiction"
# anthologies, foreign editions and single-story extracts are not issues of the US magazine
exclude = 'Best_From|Australian|\(UK\)|_UK_|TheCricketBall'

[[magazine]]
slug = "galaxy"
block = 3
name = "Galaxy"
category = "pulp"
adapter = "ia_collection"
collection = "galaxymagazine"
# the Galaxy Science Fiction Novels are a book series; the 1994 2nd series is a different magazine; GalaxyPD is a
# compilation
exclude = 'Novel_|Santa_Covers|2nd_Series|^GalaxyPD$'

[[magazine]]
slug = "fantastic"
block = 4
name = "Fantastic"
category = "pulp"
adapter = "ia_collection"
collection = "fantasticsfstories"

[[magazine]]
slug = "twilight-zone"
block = 5
name = "Rod Serling's The Twilight Zone Magazine"
category = "pulp"
adapter = "ia_collection"
collection = "twilightzonemagazine"

# Packs: one IA item holding many issues (sub-books). Dates: tools/sources/ia/<item>.dates.json, made once with
# build_catalog.py --date-packs (reads the cover date of anchor issues from their OCR text, see catalog/pack_dates.py).
[[magazine]]
slug = "dragon"
block = 6
name = "Dragon"
category = "rpg"
adapter = "ia_pack"
item = "DragonMagazine260_201801"
years = [1976, 2013]
issue_pattern = 'Dragon ?Magazine ?(\d+)'
special_pattern = 'Annual|Best of|Compendium|The Art of|Web ?(Supplement|Enhancement)'
# the OCR of #2–#9 (1976–77, irregular schedule) quotes many dates; spread them evenly between #1 (Jun 1976) and #10
# (Oct 1977), both read from the OCR
interpolate = [[1, 10]]

[[magazine]]
slug = "dungeon"
block = 7
name = "Dungeon"
category = "rpg"
adapter = "ia_pack"
item = "dungeon-magazine"
years = [1986, 2013]
issue_pattern = 'Dungeon Magazine #? ?(\d+)(?!\d).*'
# The OCR of 1986–2003 issues has no printed date (it is in the cover art), so the schedule comes from the masthead
# ("published bimonthly" up to #97, "monthly" from #98) and dates read from the OCR: #1 Oct 1986, #60 Aug 1996,
# #61 Oct 1996, #63 Feb 1997, #64 Oct 1997 (TSR's 1997 pause), #66 Feb 1998, #68 Jun 1998, #150 Sep 2007 (last print
# issue), #155 Jun 2008, #160 Nov 2008, #170 Sep 2009, #221 Dec 2013. Issues #151–#154 keep their OCR dates.
schedule = [
  { from = 1, to = 63, start = "1986-10", step = 2 },
  { from = 64, to = 97, start = "1997-10", step = 2 },
  { from = 98, to = 150, start = "2003-05", step = 1 },
  { from = 155, to = 221, start = "2008-06", step = 1 },
]
