[[magazine]]
slug = "a-espada-selvagem-de-conan"
block = 13
name = "A Espada Selvagem de Conan"
category = "comics"
adapter = "ia_pack"
item = "aespadaselvagemdeconan2"
year_only = true
issue_pattern = 'A\.Espada\.Selvagem\.de\.Conan\.0*(\d+)\..*'
