special_pattern = 'Asterix|Obelix'
# original album years (French editions)
special_years = { "Asterix_Versus_Caesar" = 1985, "How_Obelix_Fell_into_the_Magic_Potion" = 1989, "Asterix_Conquers_America" = 1994 }
year_anchors = [[1, 1961], [2, 1962], [3, 1963], [4, 1964], [5, 1965], [6, 1965], [7, 1966], [8, 1966], [9, 1966],
  [10, 1967], [11, 1968], [12, 1968], [13, 1969], [14, 1969], [15, 1970], [16, 1970], [17, 1971], [18, 1972],
  [19, 1972], [20, 1973], [21, 1974], [22, 1975], [23, 1976], [24, 1979], [25, 1980], [26, 1981], [27, 1983],
  [28, 1987], [29, 1991], [30, 1996], [31, 2001], [32, 2003], [33, 2005], [34, 2009], [35, 2013], [36, 2015],
  [37, 2017], [38, 2019], [39, 2021], [40, 2023]]

