[[magazine]]
slug = "asterix"
block = 19
name = "Asterix"
category = "comics"
adapter = "ia_pack"
item = "35-asterix-and-the-picts"
year_only = true
issue_pattern = '(?:Asterix v)?0*(\d+)(?: - |[ _])(?P<title>.+?)(?: \(\d{4}\).*)?'
