<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline B · Overview and stage — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C}a:hover{color:#C8321F}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 72px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118; box-sizing: border-box">
<a href="#" style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; color: #F2B705; text-shadow: 3px 3px 0 #1F4E8C; text-decoration: none">BANCA</a>
<nav style="display: flex; gap: 8px">
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">PULP</a>
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">RPG</a>
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; background: #F2B705; color: #2A2118; border: 2px solid #2A2118; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">ATLAS</a>
</nav>
<div style="flex-grow: 1"></div>
<button aria-label="Search the Atlas" style="width: 48px; height: 48px; border-radius: 4px; background: #F5EBD3; border: 2px solid #2A2118; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg></button>
</div>

<div style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; border-bottom: 2px solid #2A2118; background: #F7EEDA; box-sizing: border-box">
<a href="#" aria-label="Back to Atlas home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 28px; line-height: 1">TIMELINE</h1>
<div role="group" aria-label="Zoom" style="display: flex; border: 2px solid #2A2118; border-radius: 4px; overflow: hidden; margin-left: 8px">
<sc-for list="{{zooms}}" as="z" hint-placeholder-count="2">
<button onClick="{{z.pick}}" style="height: 40px; padding: 0 12px; border: 0; border-right: {{z.sep}}; background: {{z.bg}}; color: {{z.ink}}; font: 700 14px 'Source Serif 4', serif; cursor: pointer">{{z.label}}</button>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<sc-for list="{{laneChips}}" as="l" hint-placeholder-count="7">
<button onClick="{{l.toggle}}" aria-pressed="{{l.on}}" style="height: 40px; padding: 0 9px; display: flex; align-items: center; gap: 6px; border: 2px solid {{l.border}}; border-radius: 20px; background: {{l.bg}}; color: {{l.ink}}; font: 600 13px 'Source Serif 4', serif; cursor: pointer"><span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #2A2118; background: {{l.dot}}"></span>{{l.short}}</button>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 124px; width: 1280px; height: 92px; border-bottom: 2px solid #2A2118; box-sizing: border-box; background: #E4D4AF">
<div style="position: absolute; left: {{win.left}}px; top: 6px; width: {{win.w}}px; height: 60px; box-sizing: border-box; border: 3px solid #2A2118; background: rgba(247,238,218,0.85); box-shadow: 3px 3px 0 #2A2118"></div>
<sc-for list="{{ovRows}}" as="r" hint-placeholder-count="7">
<div style="position: absolute; left: 24px; top: {{r.top}}px; width: 1232px; height: 1px; background: rgba(42,33,24,0.15)"></div>
<sc-for list="{{r.marks}}" as="m" hint-placeholder-count="4">
<div style="position: absolute; left: {{m.left}}px; top: {{m.top}}px; width: {{m.w}}px; height: 6px; background: {{r.c}}; border: {{m.border}}; box-sizing: content-box"></div>
</sc-for>
</sc-for>
<sc-for list="{{ovPins}}" as="p" hint-placeholder-count="3">
<div style="position: absolute; left: {{p.left}}px; top: 2px; width: 2px; height: 66px; background: {{p.c}}"></div>
</sc-for>
<sc-for list="{{ovYears}}" as="y" hint-placeholder-count="15">
<div style="position: absolute; left: {{y.left}}px; top: 70px; transform: translateX(-50%); font-size: 12px; font-weight: {{y.w}}; font-variant-numeric: tabular-nums; color: #5E4E3A">{{y.label}}</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 216px; width: 900px; height: 584px; box-sizing: border-box; padding: 12px 16px 0 20px; display: flex; gap: {{gap}}px">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="6">
<div style="width: {{colW}}px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 22px; line-height: 1; padding-bottom: 6px; border-bottom: 3px solid #2A2118; font-variant-numeric: tabular-nums">{{col.label}}</div>
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="position: relative; display: flex; flex-direction: column; padding: 0; border: {{c.border}}; border-radius: 3px; background: {{c.bg}}; color: #2A2118; box-shadow: {{c.shadow}}; opacity: {{c.op}}; text-align: left; overflow: visible; cursor: pointer">
<span style="display: block; height: {{thumbH}}px; border-bottom: 4px solid {{c.laneC}}; background: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px) 0 0 / 6px 6px, {{c.thumb}}"></span>
<span style="display: block; padding: 5px 7px 6px">
<span style="display: block; font: 600 13px/1.2 'Source Serif 4', serif; max-height: 31px; overflow: hidden">{{c.title}}</span>
<span style="display: block; font: 12px 'Source Serif 4', serif; color: #5E4E3A; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.meta}}</span>
</span>
<sc-if value="{{c.hasRel}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: -4px; top: -9px; padding: 2px 5px; border-radius: 3px; background: #C8321F; color: #FFF4DC; font: 700 9px 'Source Serif 4', serif; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap">{{c.rel}}</span></sc-if>
<sc-if value="{{c.readable}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C8321F; background: rgba(247,238,218,0.92); color: #C8321F; font: 800 11px 'Big Shoulders Display', sans-serif; display: flex; align-items: center; justify-content: center">R</span></sc-if>
</button>
</sc-for>
<sc-if value="{{col.hasMore}}" hint-placeholder-val="{{ false }}">
<button style="height: 40px; border: 2px dashed #8A7A62; border-radius: 3px; background: transparent; color: #5E4E3A; font: 700 13px 'Source Serif 4', serif; cursor: pointer">+{{col.more}} more</button>
</sc-if>
</div>
</sc-for>
</div>

<aside style="position: absolute; right: 0; top: 216px; width: 380px; height: 584px; box-sizing: border-box; padding: 16px 20px; background: #F7EEDA; border-left: 3px solid #2A2118; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<div style="height: 96px; flex-shrink: 0; border: 2px solid #2A2118; background: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px) 0 0 / 6px 6px, {{sel.thumb}}"></div>
<div style="font-size: 10px; color: #5E4E3A; margin-top: -4px">[Image credit · licence]</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; background: {{sel.laneC}}; color: {{sel.laneInk}}">{{sel.type}}</span>
<span style="font-size: 14px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{sel.when}}</span>
</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; line-height: 0.95">{{sel.titleCaps}}</div>
<div style="font-size: 14px; line-height: 1.45">{{sel.summary}}</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="border-top: 2px solid #D6C6A2; padding-top: 6px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C8321F">{{g.rel}}</div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
<button onClick="{{i.pick}}" style="display: flex; justify-content: space-between; width: 100%; min-height: 30px; align-items: center; padding: 0; border: 0; background: transparent; font: 600 14px 'Source Serif 4', serif; color: #2A2118; text-align: left; cursor: pointer"><span>{{i.title}}</span><span style="font-weight: 400; font-size: 13px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{i.meta}}</span></button>
</sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 10px; margin-top: auto">
<a href="#" style="height: 44px; padding: 0 16px; display: flex; align-items: center; background: #C8321F; color: #FFF4DC; border: 2px solid #2A2118; border-radius: 4px; box-shadow: 3px 3px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; text-decoration: none">OPEN</a>
<button style="height: 44px; padding: 0 12px; background: #F7EEDA; color: #2A2118; border: 2px solid #2A2118; border-radius: 4px; box-shadow: 3px 3px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; cursor: pointer">{{sel.want}}</button>
</div>
</aside>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { zoom: 'decade', sel: 'wotw', off: {} };
}
renderVals() {
const s = this.state;
const LANES = [
{ id: 'mag', short: 'Mags', c: '#C8321F', ink: '#FFF4DC' },
{ id: 'book', short: 'Books', c: '#1F4E8C', ink: '#F7EEDA' },
{ id: 'film', short: 'Film', c: '#2A2118', ink: '#EFE0C2' },
{ id: 'music', short: 'Music', c: '#2E7D6E', ink: '#F7EEDA' },
{ id: 'art', short: 'Art', c: '#F2B705', ink: '#2A2118' },
{ id: 'comic', short: 'Comics', c: '#B0457E', ink: '#FFF4DC' },
{ id: 'world', short: 'World', c: '#7D6B55', ink: '#FFF4DC' }
];
const LC = {}; LANES.forEach((l, i) => { LC[l.id] = { ...l, i }; });
const IT = [
{ id: 'tm', t: 'The Time Machine', y: 1895, lane: 'book', type: 'Book', want: 'Read' },
{ id: 'wotw', t: 'The War of the Worlds', y: 1898, lane: 'book', type: 'Book', want: 'Read', sum: 'Martians land in Surrey and overrun southern England. Wells’s novel set the pattern for every alien-invasion story that followed [1].' },
{ id: 'trip', t: 'A Trip to the Moon', y: 1902, lane: 'film', type: 'Film', want: 'Watch' },
{ id: 'planets', t: 'Holst · The Planets', y: 1918, lane: 'music', type: 'Music', want: 'Listen' },
{ id: 'amz', t: 'Amazing Stories', y: 1926, lane: 'mag', type: 'Magazine', want: 'Read', readable: true, sum: 'Hugo Gernsback launches the first magazine devoted to science fiction, reprinting Wells, Verne and Poe [1].' },
{ id: 'acc', t: 'The New Accelerator', y: 1926, lane: 'mag', type: 'Story', want: 'Read', readable: true },
{ id: 'paul', t: 'Frank R. Paul · cover', y: 1926, lane: 'art', type: 'Illustration', want: 'See' },
{ id: 'theremin', t: 'Theremin patented', y: 1928, lane: 'music', type: 'Music', want: 'Listen' },
{ id: 'buck', t: 'Buck Rogers strip', y: 1929, lane: 'comic', type: 'Comic', want: 'Read' },
{ id: 'ast', t: 'Campbell edits Astounding', y: 1937, lane: 'mag', type: 'Magazine', want: 'Read' },
{ id: 'radio', t: 'War of the Worlds (radio)', y: 1938, lane: 'film', type: 'Radio', want: 'Listen', sum: 'Orson Welles’s Mercury Theatre plays the novel as live news bulletins on 30 October 1938 [2].' },
{ id: 'vesta', t: 'Marooned off Vesta', y: 1939, lane: 'mag', type: 'Story', want: 'Read', readable: true, sum: 'Isaac Asimov’s first published story, in Amazing Stories, March 1939 [1].' },
{ id: 'ww2', t: 'World War II', y: 1939, y2: 1945, lane: 'world', type: 'Event', want: 'See' },
{ id: 'night', t: 'Nightfall', y: 1941, lane: 'mag', type: 'Story', want: 'Read' },
{ id: 'run', t: 'Runaround', y: 1942, lane: 'mag', type: 'Story', want: 'Read' },
{ id: 'fst', t: 'Foundation (stories)', y: 1942, lane: 'mag', type: 'Story', want: 'Read' },
{ id: 'bones', t: 'Bonestell · Saturn from Titan', y: 1944, lane: 'art', type: 'Painting', want: 'See' },
{ id: 'hiro', t: 'Hiroshima', y: 1945, lane: 'world', type: 'Event', want: 'See' },
{ id: 'irobot', t: 'I, Robot', y: 1950, lane: 'book', type: 'Book', want: 'Read' },
{ id: 'fnd', t: 'Foundation', y: 1951, lane: 'book', type: 'Book', want: 'Read' },
{ id: 'astro', t: 'Astro Boy', y: 1952, lane: 'comic', type: 'Manga', want: 'Read' },
{ id: 'film53', t: 'The War of the Worlds', y: 1953, lane: 'film', type: 'Film', want: 'Watch' },
{ id: 'sput', t: 'Sputnik', y: 1957, lane: 'world', type: 'Event', want: 'See' },
{ id: 'album', t: 'Jeff Wayne’s War of the Worlds', y: 1978, lane: 'music', type: 'Album', want: 'Listen' },
{ id: 'film05', t: 'War of the Worlds', y: 2005, lane: 'film', type: 'Film', want: 'Watch' },
{ id: 'series', t: 'Foundation (series)', y: 2021, lane: 'film', type: 'Series', want: 'Watch' }
];
const BY = {}; IT.forEach((i) => { BY[i.id] = i; });
const E = [
['wotw', 'radio', 'Adapted as'], ['wotw', 'film53', 'Adapted as'], ['wotw', 'album', 'Adapted as'], ['wotw', 'film05', 'Adapted as'],
['wotw', 'amz', 'Influenced'], ['tm', 'amz', 'Influenced'], ['acc', 'amz', 'Published in'], ['paul', 'amz', 'Cover of'],
['vesta', 'amz', 'Published in'], ['amz', 'buck', 'Adapted as'], ['night', 'ast', 'Published in'], ['run', 'ast', 'Published in'],
['fst', 'ast', 'Published in'], ['run', 'irobot', 'Collected in'], ['fst', 'fnd', 'Collected in'], ['fnd', 'series', 'Adapted as'],
['run', 'astro', 'Same theme'], ['ww2', 'hiro', 'Includes'], ['planets', 'bones', 'Same theme'], ['trip', 'bones', 'Same theme']
];
const INV = { 'Adapted as': 'Adapted from', 'Influenced': 'Influenced by', 'Published in': 'Published', 'Cover of': 'Cover by', 'Collected in': 'Collects', 'Includes': 'Part of', 'Same theme': 'Same theme' };
const conn = {};
E.forEach(([a, b, r]) => { if (a === s.sel) conn[b] = r; else if (b === s.sel) conn[a] = INV[r] || r; });
const pick = (id) => () => this.setState({ sel: id });
const grad = (l) => 'linear-gradient(150deg,' + LC[l].c + ' 0%, #F7EEDA 140%)';
const visible = IT.filter((i) => !s.off[i.lane]);

const OX = 24, OW = 1232, OA = 1890, OB = 2030;
const ox = (y) => OX + (y - OA) / (OB - OA) * OW;
const W = s.zoom === 'year' ? { a: 1937, b: 1946 } : { a: 1890, b: 1950 };
const ovRows = LANES.filter((l) => !s.off[l.id]).map((l, r) => ({
c: l.c, top: 9 + r * 8 + 3,
marks: visible.filter((i) => i.lane === l.id).map((i) => ({
left: ox(i.y), top: 9 + r * 8, w: i.y2 ? ox(i.y2) - ox(i.y) : 3,
border: i.id === s.sel ? '2px solid #2A2118' : '0'
}))
}));
const ovPins = [{ left: ox(BY[s.sel].y), c: '#2A2118' }].concat(Object.keys(conn).map((id) => ({ left: ox(BY[id].y), c: '#C8321F' })));
const ovYears = [];
for (let y = 1890; y <= 2030; y += 10) ovYears.push({ left: ox(y), label: y % 50 === 0 || y === 2020 ? String(y) : '’' + String(y).slice(2), w: y % 50 === 0 ? '700' : '400' });

const buckets = [];
if (s.zoom === 'year') { for (let y = 1937; y <= 1945; y++) buckets.push({ label: String(y), a: y, b: y + 1 }); }
else { for (let d = 1890; d < 1950; d += 10) buckets.push({ label: d + 's', a: d, b: d + 10 }); }
const per = s.zoom === 'year' ? 3 : 4;
const cols = buckets.map((bk) => {
const inB = visible.filter((i) => i.y >= bk.a && i.y < bk.b);
inB.sort((p, q) => {
const rp = p.id === s.sel ? 0 : (conn[p.id] ? 1 : 2);
const rq = q.id === s.sel ? 0 : (conn[q.id] ? 1 : 2);
return rp - rq || p.y - q.y || LC[p.lane].i - LC[q.lane].i;
});
const shown = inB.slice(0, per);
return {
label: bk.label, more: inB.length - shown.length, hasMore: inB.length > shown.length,
cards: shown.map((i) => {
const isSel = i.id === s.sel; const isConn = !!conn[i.id];
return {
title: i.t, meta: (i.y2 ? i.y + '–' + i.y2 : i.y) + ' · ' + i.type, thumb: grad(i.lane), laneC: LC[i.lane].c,
readable: !!i.readable, hasRel: isConn, rel: conn[i.id] || '', pick: pick(i.id),
bg: isSel ? '#F2B705' : '#F7EEDA',
border: isSel ? '2px solid #2A2118' : (isConn ? '2px solid #C8321F' : '1.5px solid #2A2118'),
shadow: isSel ? '4px 4px 0 #2A2118' : (isConn ? '3px 3px 0 #C8321F' : 'none'),
op: isSel || isConn ? '1' : '0.5'
};
})
};
});
const n = buckets.length; const gap = s.zoom === 'year' ? 8 : 12;
const colW = Math.floor((900 - 36 - gap * (n - 1)) / n);

const groupsMap = {};
Object.keys(conn).forEach((id) => {
const it = BY[id]; const out = it.y < W.a || it.y >= W.b;
const g = out ? 'Elsewhere in time · ' + conn[id] : conn[id];
(groupsMap[g] = groupsMap[g] || []).push({ title: it.t, meta: it.y + ' · ' + it.type, pick: pick(id) });
});
const it = BY[s.sel]; const L = LC[it.lane];
const zooms = [['decade', 'Decades'], ['year', 'Years']].map(([k, label], i) => ({
label, bg: s.zoom === k ? '#2A2118' : '#F7EEDA', ink: s.zoom === k ? '#F2B705' : '#2A2118', sep: i === 0 ? '2px solid #2A2118' : '0',
pick: () => this.setState({ zoom: k })
}));
return {
zooms, ovRows, ovPins, ovYears, cols, colW, gap,
thumbH: s.zoom === 'year' ? 40 : 54,
win: { left: ox(W.a), w: ox(W.b) - ox(W.a) },
laneChips: LANES.map((l) => {
const on = !s.off[l.id];
return { short: l.short, on: on ? 'true' : 'false', dot: on ? l.c : 'transparent', bg: on ? '#F7EEDA' : 'transparent', border: on ? '#2A2118' : '#B9A884', ink: on ? '#2A2118' : '#8A7A62',
toggle: () => { const off = { ...s.off }; off[l.id] = !off[l.id]; this.setState({ off }); } };
}),
groups: Object.keys(groupsMap).slice(0, 3).map((g) => ({ rel: g, items: groupsMap[g].slice(0, 2) })),
sel: {
titleCaps: it.t.toUpperCase(), type: it.type, when: it.y2 ? it.y + '–' + it.y2 : String(it.y),
summary: it.sum || '[Summary — curated text pending review]', laneC: L.c, laneInk: L.ink,
thumb: grad(it.lane), want: '+ WANT TO ' + it.want.toUpperCase()
}
};
}
}
</script>
</body>
</html>
