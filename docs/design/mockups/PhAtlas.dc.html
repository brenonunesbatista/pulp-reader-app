<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas — phone sketch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C}
</style>
</helmet>
<div style="position: relative; width: 412px; height: 892px; overflow: hidden; display: flex; flex-direction: column; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; color: #F2B705; text-shadow: 2px 2px 0 #1F4E8C">ATLAS</div>
<div style="flex-grow: 1"></div>
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #FFF4DC; padding: 4px 8px; border: 2px dashed #FFF4DC">SKETCH</div>
</div>

<div style="display: flex; gap: 8px; padding: 10px 0 10px 16px; overflow: hidden; border-bottom: 2px solid #2A2118; background: #F7EEDA">
<sc-for list="{{lanes}}" as="l" hint-placeholder-count="6">
<button style="height: 40px; padding: 0 12px; flex-shrink: 0; border-radius: 20px; border: 2px solid #2A2118; background: {{l.bg}}; color: #2A2118; font: 600 14px 'Source Serif 4', serif; cursor: pointer">{{l.name}}</button>
</sc-for>
</div>

<div style="position: relative; flex-grow: 1; padding: 14px 16px 0; min-height: 0">
<div style="position: absolute; left: 76px; top: 0; bottom: 0; width: 3px; background: #2A2118"></div>
<sc-for list="{{events}}" as="e" hint-placeholder-count="7">
<div style="position: relative; display: grid; grid-template-columns: 50px 24px minmax(0, 1fr); align-items: center; gap: 0; margin-bottom: 10px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; color: {{e.yearInk}}">{{e.year}}</div>
<div style="width: 14px; height: 14px; border-radius: 50%; border: 3px solid #2A2118; background: {{e.dot}}; margin-left: 2px"></div>
<a href="#" style="display: flex; flex-direction: column; padding: 8px 12px; border: 2px solid #2A2118; border-radius: 4px; background: {{e.bg}}; color: {{e.ink}}; text-decoration: none; box-shadow: {{e.shadow}}">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8">{{e.lane}}</span>
<span style="font-size: 16px; font-weight: 600">{{e.label}}</span>
</a>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 72px; height: 250px; box-sizing: border-box; padding: 10px 18px 16px; background: #F7EEDA; border-top: 2px solid #2A2118; border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(42,33,24,0.25); display: flex; flex-direction: column; gap: 8px">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #B9A884"></div>
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5E4E3A">Story · Jules Verne · 1877</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 32px; line-height: 0.9">OFF ON A COMET</div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C8321F; margin-top: 4px">Adapted as · Same theme · Explore next</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<a href="#" style="padding: 6px 10px; border: 2px solid #2A2118; border-radius: 4px; font-size: 13px; font-weight: 600; color: #2A2118; text-decoration: none">Valley of the Dragons · 1961</a>
<a href="#" style="padding: 6px 10px; border: 2px solid #2A2118; border-radius: 4px; font-size: 13px; font-weight: 600; color: #2A2118; text-decoration: none">When Worlds Collide</a>
<a href="#" style="padding: 6px 10px; border: 2px solid #2A2118; border-radius: 4px; font-size: 13px; font-weight: 600; color: #2A2118; text-decoration: none">The Man from the Atom</a>
</div>
<div style="display: flex; gap: 10px; margin-top: auto">
<a href="PhIssue.dc.html" style="flex-grow: 1; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #2A2118; border-radius: 4px; background: #C8321F; color: #FFF4DC; box-shadow: 3px 3px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; text-decoration: none">READ IN BANCA</a>
<button style="flex-grow: 1; height: 44px; border: 2px solid #2A2118; border-radius: 4px; background: #F7EEDA; box-shadow: 3px 3px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; cursor: pointer">+ WANT TO READ</button>
</div>
</div>

<nav aria-label="Sections" style="height: 72px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #F7EEDA; border-top: 2px solid #2A2118; position: relative">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #2A2118; text-decoration: none">
<span style="width: 56px; height: 30px; border-radius: 15px; background: {{n.bg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg></span>
<span style="font-size: 12px; font-weight: {{n.weight}}">{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":892}}'>
class Component extends DCLogic {
renderVals() {
const ev = (year, lane, label, hot) => ({
year, lane, label,
bg: hot ? '#C8321F' : '#F7EEDA', ink: hot ? '#FFF4DC' : '#2A2118',
dot: hot ? '#C8321F' : '#F2B705', yearInk: hot ? '#C8321F' : '#2A2118',
shadow: hot ? '3px 3px 0 #2A2118' : 'none'
});
return {
lanes: [
{ name: 'All lanes', bg: '#F2B705' }, { name: 'Magazines', bg: 'transparent' }, { name: 'Film', bg: 'transparent' }, { name: 'Music', bg: 'transparent' }, { name: 'Painting', bg: 'transparent' }, { name: 'World', bg: 'transparent' }
],
events: [
ev('1923', 'Magazines', 'Weird Tales begins'),
ev('1924', 'Painting', 'Surrealist Manifesto'),
ev('1926', 'Stories', 'Off on a Comet, in Amazing', true),
ev('1927', 'Film', 'Metropolis'),
ev('1928', 'Music', 'Theremin patented')
],
nav: [
{ label: 'Pulp', href: 'PhLibrary.dc.html', bg: 'transparent', weight: '400', d: 'M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z' },
{ label: 'RPG', href: '#', bg: 'transparent', weight: '400', d: 'M12 3l8 5v8l-8 5-8-5V8zM12 3v18M4 8l16 8M20 8L4 16' },
{ label: 'Atlas', href: 'PhAtlas.dc.html', bg: '#F2B705', weight: '700', d: 'M3 12h18M7 8v8M12 5v14M17 9v6' },
{ label: 'Search', href: '#', bg: 'transparent', weight: '400', d: 'M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4' }
]
};
}
}
</script>
</body>
</html>
