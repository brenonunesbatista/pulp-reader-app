<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas path — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E8C}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; display: flex; flex-direction: column; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118; box-sizing: border-box">
<a href="TabAtlasHome.dc.html" style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; color: #F2B705; text-shadow: 3px 3px 0 #1F4E8C; text-decoration: none">BANCA</a>
<nav style="display: flex; gap: 8px">
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">PULP</a>
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">RPG</a>
<a href="TabAtlasHome.dc.html" style="height: 44px; padding: 0 16px; border-radius: 4px; background: #F2B705; color: #2A2118; border: 2px solid #2A2118; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">ATLAS</a>
</nav>
</div>

<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 24px 0 8px; border-bottom: 2px solid #2A2118; background: #F7EEDA; box-sizing: border-box">
<a href="TabAtlasHome.dc.html" aria-label="Back to Atlas home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #C8321F">PATH</span>
<h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; line-height: 1">FROM WELLS TO FOUNDATION</h1>
<div style="flex-grow: 1"></div>
<div style="width: 220px; height: 10px; border: 2px solid #2A2118; background: #E4D4AF"><div style="width: 33%; height: 100%; background: #C8321F"></div></div>
<span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">12 / 36</span>
</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: 520px minmax(0, 1fr); min-height: 0">

<nav aria-label="Stops" style="position: relative; padding: 14px 20px 0 24px; border-right: 2px solid #2A2118; overflow: hidden">
<div style="position: absolute; left: 51px; top: 20px; bottom: 0; width: 4px; background: #2A2118"></div>
<div style="position: relative; display: flex; align-items: center; gap: 14px; height: 44px; margin-bottom: 4px">
<span style="width: 56px; display: flex; justify-content: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: #2A2118"></span></span>
<span style="font-size: 14px; color: #5E4E3A">Stops 1–9 explored · Wells, Gernsback, Paul, Verne…</span>
</div>
<sc-for list="{{stops}}" as="s" hint-placeholder-count="8">
<button onClick="{{s.pick}}" style="position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 6px 10px 6px 0; margin-bottom: 4px; border: {{s.border}}; border-radius: 4px; background: {{s.bg}}; box-shadow: {{s.shadow}}; color: #2A2118; text-align: left; cursor: pointer">
<span style="width: 56px; flex-shrink: 0; display: flex; justify-content: center"><span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 3px solid #2A2118; background: {{s.dot}}; color: {{s.dotInk}}; display: flex; align-items: center; justify-content: center; font: 800 16px 'Big Shoulders Display', sans-serif; font-variant-numeric: tabular-nums">{{s.n}}</span></span>
<span style="width: 50px; height: 50px; flex-shrink: 0; border: 2px solid #2A2118; background: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px) 0 0 / 5px 5px, {{s.bg2}}; opacity: {{s.imgOp}}"></span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5E4E3A; font-variant-numeric: tabular-nums">{{s.year}} · {{s.type}}</span>
<span style="display: block; font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.t}}</span>
</span>
<sc-if value="{{s.readable}}" hint-placeholder-val="{{ false }}"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid #C8321F; color: #C8321F; font: 800 11px 'Big Shoulders Display', sans-serif; display: flex; align-items: center; justify-content: center">R</span></sc-if>
</button>
</sc-for>
</nav>

<article style="padding: 22px 32px 0; display: flex; flex-direction: column; gap: 12px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #C8321F">STOP {{cur.n}} OF 36</span>
<span style="height: 24px; padding: 0 7px; display: inline-flex; align-items: center; border-radius: 3px; background: {{cur.c}}; color: {{cur.ink}}; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">{{cur.type}}</span>
<span style="font-size: 15px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{cur.year}}</span>
</div>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<div style="height: 190px; border: 2px solid #2A2118; box-shadow: 4px 4px 0 #2A2118; background: radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1.5px) 0 0 / 6px 6px, {{cur.bg2}}"></div>
<figcaption style="font-size: 11px; color: #5E4E3A">[Image credit · licence · source]</figcaption>
</figure>
<h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 46px; line-height: 0.92">{{cur.title}}</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5">{{cur.d}}<a href="#" style="font-size: 11px; font-weight: 700; vertical-align: super; text-decoration: none; padding: 0 2px">[1]</a></p>
<div style="padding: 10px 14px; border: 2px solid #2A2118; border-left-width: 2px; background: #F7EEDA; border-radius: 4px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #C8321F">WHY IT MATTERS</div>
<div style="font-size: 16px; line-height: 1.45; margin-top: 2px">{{cur.why}}</div>
</div>
<div style="display: flex; gap: 12px; align-items: stretch; margin-top: auto; padding-bottom: 20px">
<a href="TabEntity.dc.html" style="height: 52px; padding: 0 18px; display: flex; align-items: center; background: #C8321F; color: #FFF4DC; border: 2px solid #2A2118; border-radius: 4px; box-shadow: 4px 4px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; text-decoration: none">{{cur.action}}</a>
<button style="height: 52px; padding: 0 14px; background: #F7EEDA; color: #2A2118; border: 2px solid #2A2118; border-radius: 4px; box-shadow: 4px 4px 0 #2A2118; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.06em; cursor: pointer">+ WANT TO READ</button>
<button onClick="{{goNext}}" style="flex-grow: 1; display: flex; align-items: center; gap: 12px; padding: 6px 12px; border: 2px dashed #2A2118; border-radius: 4px; background: transparent; color: #2A2118; text-align: left; cursor: pointer">
<span style="flex-grow: 1"><span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #C8321F">NEXT STOP</span><span style="display: block; font-size: 15px; font-weight: 700">{{nextT}}</span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</article>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cur: 13 };
}
renderVals() {
const L = { mag: ['#C8321F', '#FFF4DC'], book: ['#1F4E8C', '#F7EEDA'], film: ['#2A2118', '#EFE0C2'], world: ['#7D6B55', '#FFF4DC'] };
const g = (l) => 'linear-gradient(150deg,' + L[l][0] + ' 0%, #F7EEDA 140%)';
const S = [
{ n: 10, year: '1937', type: 'Magazine', lane: 'mag', t: 'Campbell takes over Astounding', d: 'John W. Campbell becomes editor of Astounding Stories and starts reshaping it into Astounding Science Fiction.', why: 'He pushed writers toward plausible science and real characters: the start of the “Golden Age”.' },
{ n: 11, year: '1938', type: 'Radio', lane: 'film', t: 'The War of the Worlds on the radio', d: 'Orson Welles’s Mercury Theatre tells Wells’s invasion as a string of live news bulletins.', why: 'Proved how strongly the invasion story could reach a mass audience.' },
{ n: 12, year: '1939', type: 'Story', lane: 'mag', t: 'Marooned off Vesta', readable: true, d: 'Isaac Asimov’s first published story appears in Amazing Stories, March 1939.', why: 'The start of the career that carries this path to its last stop.', action: 'READ IN BANCA' },
{ n: 13, year: '1941', type: 'Story', lane: 'mag', t: 'Nightfall', d: 'On a planet lit by six suns, night comes once every 2,049 years. Campbell gave Asimov the idea from a line by Emerson.', why: 'Often named the best science-fiction short story; it showed what Campbell’s Astounding wanted: a big idea told through people.' },
{ n: 14, year: '1942', type: 'Story', lane: 'mag', t: 'Runaround', d: 'A robot on Mercury circles a selenium pool, caught between two of its own laws.', why: 'The first explicit statement of the Three Laws of Robotics.' },
{ n: 15, year: '1942', type: 'Story', lane: 'mag', t: 'Foundation begins', d: 'A mathematician predicts the fall of a galactic empire and plans to shorten the dark age that follows.', why: 'Brought history and social science (“psychohistory”) into space opera.' },
{ n: 16, year: '1945', type: 'Event', lane: 'world', t: 'Hiroshima', d: 'The first atomic bomb used in war.', why: 'Overnight, the atomic stories of the magazines read like prophecy.' },
{ n: 17, year: '1950', type: 'Book', lane: 'book', t: 'I, Robot', d: 'Nine robot stories gathered into one book.', why: 'Made the Three Laws famous beyond the magazines.' }
];
const cur = this.state.cur;
const c = S.find((s) => s.n === cur);
const nx = S.find((s) => s.n === cur + 1);
return {
stops: S.map((s) => {
const done = s.n < 13; const isCur = s.n === cur;
return {
...s, bg2: g(s.lane), readable: !!s.readable, pick: () => this.setState({ cur: s.n }),
dot: isCur ? '#F2B705' : (done ? '#2A2118' : '#F7EEDA'), dotInk: done && !isCur ? '#F2B705' : '#2A2118',
bg: isCur ? '#F7EEDA' : 'transparent', border: isCur ? '2px solid #2A2118' : '2px solid transparent',
shadow: isCur ? '4px 4px 0 #2A2118' : 'none', imgOp: done || isCur ? '1' : '0.6'
};
}),
cur: { ...c, title: c.t.toUpperCase(), bg2: g(c.lane), c: L[c.lane][0], ink: L[c.lane][1], action: c.action || 'OPEN' },
nextT: nx ? nx.n + ' · ' + nx.t + ' (' + nx.year + ')' : '18 · [next stop]',
goNext: () => this.setState({ cur: Math.min(17, cur + 1) })
};
}
}
</script>
</body>
</html>
