<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8321F}a:hover{color:#8E1F14}
input::placeholder{color:#7A6A52}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; display: flex; flex-direction: column; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118">
<a href="TabLibrary.dc.html" style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 46px; line-height: 1; color: #F2B705; text-shadow: 3px 3px 0 #1F4E8C; text-decoration: none">BANCA</a>
<nav style="display: flex; gap: 8px">
<a href="TabLibrary.dc.html" style="height: 44px; padding: 0 16px; border-radius: 4px; background: #F2B705; color: #2A2118; border: 2px solid #2A2118; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">PULP</a>
<a href="#" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">RPG</a>
<a href="TabAtlas.dc.html" style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #F5EBD3; color: #F5EBD3; display: flex; align-items: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-decoration: none">ATLAS</a>
</nav>
<label style="flex-grow: 1; height: 48px; border-radius: 4px; background: #F5EBD3; border: 2px solid #2A2118; display: flex; align-items: center; gap: 12px; padding: 0 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg>
<input type="search" aria-label="Search the newsstand" placeholder="Search titles, authors, editors, cover artists, translators…" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #2A2118; font: 16px 'Source Serif 4', serif">
</label>
<button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 4px; background: #F5EBD3; border: 2px solid #2A2118; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path></svg>
</button>
</div>

<div style="flex-grow: 1; padding: 22px 32px 0; display: flex; flex-direction: column; gap: 24px">

<section>
<div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 28px; line-height: 1">CONTINUE READING</h2>
<div style="flex-grow: 1; height: 4px; background: #C8321F"></div>
<a href="#" style="font-size: 15px; font-weight: 600">See all</a>
</div>
<div style="position: relative; display: flex; gap: 42px; padding: 16px 10px 0">
<div style="position: absolute; left: -32px; right: -32px; top: 0; height: 4px; background: #2A2118"></div>
<sc-for list="{{shelf}}" as="c" hint-placeholder-count="7">
<a href="TabReader.dc.html" style="width: 120px; flex-shrink: 0; color: #2A2118; text-decoration: none">
<dc-import name="Cover" w="120" bg="{{c.bg}}" date="{{c.d}}" price="{{c.price}}" hint-size="120px,166px"></dc-import>
<div style="margin-top: 14px; height: 4px; background: #D6C6A2"><div style="height: 4px; width: {{c.pct}}; background: #C8321F"></div></div>
<div style="font-size: 14px; font-weight: 700; margin-top: 7px">{{c.label}}</div>
<div style="font-size: 13px; color: #5E4E3A; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.where}}</div>
</a>
</sc-for>
</div>
</section>

<section style="flex-grow: 1; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 16px; margin-bottom: 18px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 28px; line-height: 1">PULP MAGAZINES</h2>
<div style="flex-grow: 1; height: 4px; background: #C8321F"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px">
<sc-for list="{{mags}}" as="m" hint-placeholder-count="3">
<a href="{{m.href}}" style="display: flex; gap: 18px; padding: 18px; border-radius: 4px; background: #F7EEDA; border: 2px solid #2A2118; box-shadow: 6px 6px 0 #2A2118; text-decoration: none; color: #2A2118; opacity: {{m.opacity}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 168px; flex-shrink: 0">
<sc-for list="{{m.covers}}" as="k" hint-placeholder-count="6">
<dc-import name="Cover" w="52" bg="{{k}}" tag="false" mast="{{m.mast}}" hint-size="52px,72px"></dc-import>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 28px; line-height: 0.92">{{m.title}}</div>
<div style="font-size: 14px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{m.years}}</div>
<div style="font-size: 14px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{m.count}}</div>
<div style="margin-top: auto; align-self: flex-start; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.08em; padding: 5px 10px; border: 2px solid #2A2118; color: {{m.tagInk}}; background: {{m.tagBg}}">{{m.tag}}</div>
</div>
</a>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const G = [
'linear-gradient(160deg,#F2B705 0%,#E4572E 52%,#1F4E8C 100%)',
'linear-gradient(175deg,#4FB0C6 0%,#1F4E8C 62%,#F2B705 100%)',
'linear-gradient(150deg,#E4572E 0%,#9B2420 45%,#2A2118 100%)',
'linear-gradient(165deg,#A8C95A 0%,#3C7A55 50%,#1F2E44 100%)',
'linear-gradient(170deg,#F4DE9C 0%,#E09A2C 45%,#6B2232 100%)',
'linear-gradient(155deg,#8A6FD6 0%,#2E3C8F 55%,#E4572E 100%)',
'linear-gradient(165deg,#E4572E 0%,#F2B705 40%,#2B6F86 100%)'
];
const shelf = [
{ d: 'APR 1926', price: '25¢', label: 'April 1926', where: 'Off on a Comet · p. 42', pct: '42%' },
{ d: 'AUG 1927', price: '25¢', label: 'August 1927', where: 'p. 12', pct: '12%' },
{ d: 'JUN 1928', price: '25¢', label: 'June 1928', where: 'p. 88', pct: '86%' },
{ d: 'OCT 1929', price: '25¢', label: 'October 1929', where: 'p. 31', pct: '30%' },
{ d: 'JAN 1933', price: '25¢', label: 'January 1933', where: 'p. 64', pct: '62%' },
{ d: 'MAR 1940', price: '20¢', label: 'March 1940', where: 'p. 7', pct: '6%' },
{ d: 'SEP 1947', price: '25¢', label: 'September 1947', where: 'p. 120', pct: '70%' }
].map((c, i) => ({ ...c, bg: G[i % G.length] }));
const rot = (n) => [0, 1, 2, 3, 4, 5].map((i) => G[(i + n) % G.length]);
return {
shelf,
mags: [
{ title: 'AMAZING STORIES', mast: 'AMAZ\nING', years: '1926–1956', count: '309 issues · 4,000+ stories', tag: 'OPEN', tagBg: '#F2B705', tagInk: '#2A2118', opacity: '1', href: 'TabMagazine.dc.html', covers: rot(0) },
{ title: 'FANTASY & SCIENCE FICTION', mast: 'F&SF', years: '1949–', count: 'Not yet indexed', tag: 'COMING SOON', tagBg: '#EEE2C6', tagInk: '#2A2118', opacity: '0.55', href: '#', covers: rot(2) },
{ title: 'GALAXY', mast: 'GAL\nAXY', years: '1950–1980', count: 'Not yet indexed', tag: 'COMING SOON', tagBg: '#EEE2C6', tagInk: '#2A2118', opacity: '0.55', href: '#', covers: rot(4) }
]
};
}
}
</script>
</body>
</html>
