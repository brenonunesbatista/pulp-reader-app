<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magazine — tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8321F}a:hover{color:#8E1F14}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; display: flex; flex-direction: column; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 16px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118">
<a href="TabLibrary.dc.html" aria-label="Back to the newsstand" style="width: 48px; height: 48px; border-radius: 4px; background: #F5EBD3; border: 2px solid #2A2118; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 42px; line-height: 1; color: #F2B705; text-shadow: 3px 3px 0 #1F4E8C">AMAZING STORIES</h1>
<div style="flex-grow: 1"></div>
<button aria-label="Search in this magazine" style="width: 48px; height: 48px; border-radius: 4px; background: #F5EBD3; border: 2px solid #2A2118; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg></button>
</div>

<div style="padding: 16px 32px 14px; border-bottom: 2px solid #2A2118; background: #F7EEDA; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 15px; color: #5E4E3A; font-variant-numeric: tabular-nums">1926–1956 · 309 issues · Editors <a href="#">Hugo Gernsback</a>, <a href="#">T. O'Conor Sloane</a>, <a href="#">Raymond A. Palmer</a>, <a href="#">Howard Browne</a></div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{decades}}" as="d" hint-placeholder-count="5">
<button style="height: 44px; padding: 0 16px; border-radius: 4px; border: 2px solid #2A2118; background: {{d.bg}}; color: {{d.ink}}; font: 700 16px 'Source Serif 4', serif; font-variant-numeric: tabular-nums; cursor: pointer">{{d.label}}</button>
</sc-for>
<div style="width: 2px; height: 30px; background: #D6C6A2; margin: 0 8px"></div>
<sc-for list="{{years}}" as="y" hint-placeholder-count="4">
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid {{y.border}}; background: transparent; color: #2A2118; font: 600 15px 'Source Serif 4', serif; font-variant-numeric: tabular-nums; cursor: pointer">{{y.label}}</button>
</sc-for>
<div style="flex-grow: 1"></div>
<label style="display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; cursor: pointer; min-height: 48px">
<input type="checkbox" aria-label="Readable only" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<span style="position: relative; width: 52px; height: 30px; border-radius: 15px; border: 2px solid #2A2118; background: #E4D4AF; box-sizing: border-box"><span style="position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #2A2118"></span></span>Readable only</label>
</div>
</div>

<div style="flex-grow: 1; padding: 18px 32px 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div>
<div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums">{{g.year}}</h2>
<span style="font-size: 14px; color: #5E4E3A">{{g.note}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{g.issues}}" as="c" hint-placeholder-count="9">
<a href="{{c.href}}" style="color: #2A2118; text-decoration: none; display: flex; flex-direction: column; gap: 3px">
<dc-import name="Cover" w="112" bg="{{c.bg}}" tag="false" dim="{{c.dim}}" hint-size="112px,155px"></dc-import>
<div style="font-size: 15px; font-weight: 700; margin-top: 8px">{{c.month}}</div>
<div style="font-size: 12px; color: #5E4E3A; font-variant-numeric: tabular-nums">{{c.meta}}</div>
</a>
</sc-for>
</div>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const G = [
'linear-gradient(160deg,#F2B705 0%,#E4572E 52%,#1F4E8C 100%)',
'linear-gradient(175deg,#4FB0C6 0%,#1F4E8C 62%,#F2B705 100%)',
'linear-gradient(150deg,#E4572E 0%,#9B2420 45%,#2A2118 100%)',
'linear-gradient(165deg,#A8C95A 0%,#3C7A55 50%,#1F2E44 100%)',
'linear-gradient(170deg,#F4DE9C 0%,#E09A2C 45%,#6B2232 100%)',
'linear-gradient(155deg,#8A6FD6 0%,#2E3C8F 55%,#E4572E 100%)',
'linear-gradient(165deg,#E4572E 0%,#F2B705 40%,#2B6F86 100%)'
];
const mk = (months, start, dims, first) => months.map((m, i) => ({
month: m,
bg: G[(i + start) % G.length],
dim: dims.includes(i) ? 'true' : 'false',
meta: dims.includes(i) ? 'No scan yet' : (first && i === 0 ? 'Vol. 1 No. 1 · p. 42' : 'Readable'),
href: first && i === 0 ? 'TabIssue.dc.html' : '#'
}));
return {
decades: [
{ label: 'All', bg: 'transparent', ink: '#2A2118' },
{ label: '1920s', bg: '#F2B705', ink: '#2A2118' },
{ label: '1930s', bg: 'transparent', ink: '#2A2118' },
{ label: '1940s', bg: 'transparent', ink: '#2A2118' },
{ label: '1950s', bg: 'transparent', ink: '#2A2118' }
],
years: [
{ label: '1926', border: '#2A2118' },
{ label: '1927', border: '#D6C6A2' },
{ label: '1928', border: '#D6C6A2' },
{ label: '1929', border: '#D6C6A2' }
],
groups: [
{ year: '1926', note: '9 issues · 7 readable', issues: mk(['April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'], 0, [3, 7], true) },
{ year: '1927', note: '12 issues', issues: mk(['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September'], 3, [5], false) }
]
};
}
}
</script>
</body>
</html>
