<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magazine — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8321F}a:hover{color:#8E1F14}
</style>
</helmet>
<div style="width: 412px; height: 892px; overflow: hidden; display: flex; flex-direction: column; background: #EEE2C6; color: #2A2118; font-family: 'Source Serif 4', Georgia, serif">

<div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; background: radial-gradient(rgba(255,240,200,0.16) 1.3px, transparent 1.8px) 0 0 / 7px 7px, #C8321F; border-bottom: 3px solid #2A2118">
<a href="PhLibrary.dc.html" aria-label="Back to the newsstand" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFF4DC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; line-height: 1; color: #F2B705; text-shadow: 2px 2px 0 #1F4E8C">AMAZING STORIES</h1>
<button aria-label="Search in this magazine" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF4DC" stroke-width="2.2" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg></button>
</div>

<div style="padding: 12px 0 12px 16px; background: #F7EEDA; border-bottom: 2px solid #2A2118; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; color: #5E4E3A; font-variant-numeric: tabular-nums">1926–1956 · 309 issues</div>
<div style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{decades}}" as="d" hint-placeholder-count="5">
<button style="height: 44px; padding: 0 14px; flex-shrink: 0; border-radius: 4px; border: 2px solid #2A2118; background: {{d.bg}}; color: #2A2118; font: 700 15px 'Source Serif 4', serif; font-variant-numeric: tabular-nums; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding-right: 16px">
<sc-for list="{{years}}" as="y" hint-placeholder-count="4">
<button style="height: 40px; padding: 0 10px; border-radius: 20px; border: 2px solid {{y.border}}; background: transparent; color: #2A2118; font: 600 14px 'Source Serif 4', serif; font-variant-numeric: tabular-nums; cursor: pointer">{{y.label}}</button>
</sc-for>
<div style="flex-grow: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 48px">
<input type="checkbox" aria-label="Readable only" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<span style="position: relative; width: 44px; height: 26px; border-radius: 13px; border: 2px solid #2A2118; background: #E4D4AF; box-sizing: border-box"><span style="position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #2A2118"></span></span>Readable</label>
</div>
</div>

<div style="flex-grow: 1; padding: 14px 16px 0; min-height: 0">
<div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px">
<h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 26px; line-height: 1">1926</h2>
<span style="font-size: 13px; color: #5E4E3A">9 issues · 7 readable</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 16px">
<sc-for list="{{issues}}" as="c" hint-placeholder-count="9">
<a href="{{c.href}}" style="color: #2A2118; text-decoration: none; display: flex; flex-direction: column; gap: 2px">
<dc-import name="Cover" w="113" bg="{{c.bg}}" tag="false" dim="{{c.dim}}" hint-size="113px,157px"></dc-import>
<div style="font-size: 14px; font-weight: 700; margin-top: 7px">{{c.month}}</div>
<div style="font-size: 12px; color: #5E4E3A">{{c.meta}}</div>
</a>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":892}}'>
class Component extends DCLogic {
renderVals() {
const G = [
'linear-gradient(160deg,#F2B705 0%,#E4572E 52%,#1F4E8C 100%)',
'linear-gradient(175deg,#4FB0C6 0%,#1F4E8C 62%,#F2B705 100%)',
'linear-gradient(150deg,#E4572E 0%,#9B2420 45%,#2A2118 100%)',
'linear-gradient(165deg,#A8C95A 0%,#3C7A55 50%,#1F2E44 100%)',
'linear-gradient(170deg,#F4DE9C 0%,#E09A2C 45%,#6B2232 100%)',
'linear-gradient(155deg,#8A6FD6 0%,#2E3C8F 55%,#E4572E 100%)',
'linear-gradient(165deg,#E4572E 0%,#F2B705 40%,#2B6F86 100%)'
];
const months = ['April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dims = [3, 7];
return {
decades: [
{ label: 'All', bg: 'transparent' }, { label: '1920s', bg: '#F2B705' }, { label: '1930s', bg: 'transparent' }, { label: '1940s', bg: 'transparent' }, { label: '1950s', bg: 'transparent' }
],
years: [
{ label: '1926', border: '#2A2118' }, { label: '1927', border: '#D6C6A2' }, { label: '1928', border: '#D6C6A2' }, { label: '1929', border: '#D6C6A2' }
],
issues: months.map((m, i) => ({
month: m,
bg: G[i % G.length],
dim: dims.includes(i) ? 'true' : 'false',
meta: dims.includes(i) ? 'No scan yet' : (i === 0 ? 'p. 42 of 100' : 'Readable'),
href: i === 0 ? 'PhIssue.dc.html' : '#'
}))
};
}
}
</script>
</body>
</html>
